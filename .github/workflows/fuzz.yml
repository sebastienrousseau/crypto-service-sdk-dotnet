# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# A fuzz smoke run of both SharpFuzz targets, 60 seconds each, under the
# pinned libfuzzer-dotnet driver (scripts/fuzz.sh). A crash fails the
# job and its input is uploaded. Reproduce with `make fuzz`.
name: Fuzz

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }} (60 s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [problem, success]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: scripts/fuzz.sh ${{ matrix.target }} 60
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz.sh "$TARGET" 60

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: artifacts/fuzz/findings/
          retention-days: 14
